name: Enterprise AI evaluation
on:
  push:
    branches: ["main"]
    paths: ['agent/**', '.github/workflows/hyper-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: enterprise-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    uses: mrvgao/enterprise-ai-evaluation/.github/workflows/evaluate.yml@v1.1.0
    with:
      binding-id: "16669a78-8ba7-45a1-be34-64483ded9975"
      api-url: "https://agentist.org/lab/api/enterprise-ai"
